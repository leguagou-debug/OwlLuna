name: Probe Xcode
on: workflow_dispatch
jobs:
  p:
    runs-on: macos-26
    steps:
      - name: List Xcodes
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          for x in /Applications/Xcode*.app; do
            echo "=== $x"
            defaults read "$x/Contents/Info" CFBundleShortVersionString 2>/dev/null || true
            "$x/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/swift" --version 2>/dev/null | head -1 || true
          done
