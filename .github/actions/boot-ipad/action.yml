name: Boot an iPad simulator
description: Boots an iPad on the newest iOS runtime that has one, or on the newest such runtime of one iOS version, and sets SIMULATOR_UDID.

inputs:
  ios:
    description: An iOS major version, or "latest".
    default: latest

outputs:
  udid:
    description: The booted simulator; empty when the runner has no matching runtime.
    value: ${{ steps.boot.outputs.udid }}

runs:
  using: composite
  steps:
    - id: boot
      shell: bash
      env:
        IOS: ${{ inputs.ios }}
      run: |
        runtimes=$(xcrun simctl list runtimes available --json)
        devices=$(xcrun simctl list devices available --json)
        candidates=$(jq -r --arg ios "$IOS" '
          [.runtimes[] | select(.platform == "iOS" and ($ios == "latest" or (.version | startswith($ios + "."))))]
          | sort_by(.version | split(".") | map(tonumber)) | reverse | .[].identifier' <<< "$runtimes")
        if [ -z "$candidates" ]; then
          echo "udid=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # A runtime made for one new device (iOS 27.1 with only iPhone Duo) has no iPads, so take the newest that does.
        runtime=
        for candidate in $candidates; do
          udid=$(jq -r --arg runtime "$candidate" '
            .devices[$runtime] // []
            | (map(select(.name | startswith("iPad Pro 11"))) + map(select(.name | startswith("iPad"))))
            | first | .udid // empty' <<< "$devices")
          type=$(jq -r --arg runtime "$candidate" '
            .runtimes[] | select(.identifier == $runtime) | .supportedDeviceTypes
            | (map(select(.name | startswith("iPad Pro 11"))) + map(select(.productFamily == "iPad")))
            | first | .identifier // empty' <<< "$runtimes")
          if [ -n "$udid" ] || [ -n "$type" ]; then
            runtime=$candidate
            break
          fi
        done
        if [ -z "$runtime" ]; then
          echo "::error::No iOS runtime on this runner has an iPad ($(echo $candidates))."
          exit 1
        fi
        newest=$(head -n 1 <<< "$candidates")
        if [ "$runtime" != "$newest" ]; then
          echo "::notice title=Older iOS runtime::$newest has no iPad, so this job uses $runtime."
        fi
        if [ -z "$udid" ]; then
          udid=$(xcrun simctl create "CI iPad" "$type" "$runtime")
        fi
        echo "Booting $(xcrun simctl list devices --json | jq -r --arg udid "$udid" '.devices[][] | select(.udid == $udid) | .name') on $runtime"
        xcrun simctl boot "$udid"
        echo "udid=$udid" >> "$GITHUB_OUTPUT"
        echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
